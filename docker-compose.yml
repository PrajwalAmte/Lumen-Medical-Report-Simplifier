services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile.api
    container_name: lumen-api
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379/0
      STORAGE_TYPE: ${STORAGE_TYPE:-s3}
      PYTHONUNBUFFERED: 1
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - lumen-net
    deploy:
      resources:
        limits:
          memory: 1g

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile.worker
    container_name: lumen-worker
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379/0
      STORAGE_TYPE: ${STORAGE_TYPE:-s3}
      PYTHONUNBUFFERED: 1
      PYTHONPATH: /app
    healthcheck:
      # Signal 0 to PID 1 checks the worker process is alive without killing it
      test: ["CMD-SHELL", "kill -0 1 2>/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - lumen-net
    deploy:
      resources:
        limits:
          memory: 3g

  redis:
    image: redis:7-alpine
    container_name: lumen-redis
    # Enable append-only persistence so the job queue survives container restarts
    command: redis-server --appendonly yes
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - lumen-net
    deploy:
      resources:
        limits:
          memory: 256m

  db:
    image: pgvector/pgvector:pg15
    container_name: lumen-postgres
    env_file:
      - ./backend/.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lumen}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - lumen-net
    deploy:
      resources:
        limits:
          memory: 512m

  ui:
    build:
      context: .
      dockerfile: frontend/Dockerfile.ui
    container_name: lumen-ui
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - lumen-net
    deploy:
      resources:
        limits:
          memory: 128m

volumes:
  pgdata:
  redisdata:

networks:
  lumen-net:
    driver: bridge
